{% extends 'calificaciones/base.html' %}

{% block title %}Promedio General{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card text-center shadow-sm border-0">
            <div class="card-body p-5">
                <h1 class="h3 mb-3">Promedio general</h1>
                {% if promedio_general %}
                <p class="display-5 fw-bold text-primary mb-0">{{ promedio_general|floatformat:2 }}</p>
                {% else %}
                <p class="lead text-muted mb-0">Sin datos</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
