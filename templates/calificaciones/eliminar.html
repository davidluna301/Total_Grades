{% extends 'calificaciones/base.html' %}

{% block title %}Eliminar Calificacion{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h3 text-danger mb-3">Confirmar eliminacion</h1>
                <p class="mb-4">Estas seguro de eliminar la calificacion de <strong>{{ object.nombre_estudiante }}</strong> en <strong>{{ object.asignatura }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Confirmar Eliminar</button>
                        <a href="{% url 'listar' %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
